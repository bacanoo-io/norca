# golangci-lint v2. Migrated by hand from the v1 file of Nomad (the v1
# keys deadline, skip-dirs, skip-files, output.format, check-shadowing and
# errcheck.ignore were rejected by `golangci-lint migrate`), keeping its
# choices: the same linters (gosimple is part of staticcheck in v2;
# exportloopref is gone, the loop variable is per iteration since Go 1.22),
# gofmt and goimports as formatters, the same gocritic checks off, no test
# files, the UI and the generated files left out.
version: "2"

run:
  timeout: 10m
  # Do not modify go.mod.
  modules-download-mode: readonly
  tests: false

linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - dogsled
    - durationcheck
    - gocritic
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - usestdlibvars
  settings:
    gocritic:
      disabled-checks:
        - commentFormatting
        - deprecatedComment
        # issues.exclude of the v1 file
        - ifElseChain
        - singleCaseSwitch
        - assignOp
        - unlambda
    staticcheck:
      # staticcheck (SA) and the former gosimple (S), and the two style
      # checks the v1 file asked for.
      checks:
        - SA*
        - S1*
        - ST1016
        - ST1020
  exclusions:
    generated: lax
    paths:
      - ui
      - ".*\\.generated\\.go$"
      - ".*bindata_assetfs\\.go$"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - ui
      - ".*\\.generated\\.go$"
      - ".*bindata_assetfs\\.go$"
