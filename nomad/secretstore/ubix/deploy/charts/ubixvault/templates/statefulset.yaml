{{- if and (gt (int .Values.replicaCount) 1) (not .Values.ha.enabled) -}}
{{- fail "replicaCount > 1 needs ha.enabled=true (active/standby over storage.type=mysql); without HA every replica would write the same storage" -}}
{{- end -}}
{{- if and .Values.ha.enabled (ne .Values.storage.type "mysql") -}}
{{- fail "ha.enabled requires storage.type=mysql (the file backend cannot elect an active replica)" -}}
{{- end -}}
{{- if not (has .Values.ha.antiAffinity (list "soft" "hard" "none")) -}}
{{- fail "ha.antiAffinity must be soft, hard or none" -}}
{{- end -}}
{{- if and .Values.tls.enabled (not .Values.tls.certManager.enabled) (not .Values.tls.existingSecret) -}}
{{- fail "tls.enabled is true: set tls.existingSecret (a kubernetes.io/tls Secret) or enable tls.certManager" -}}
{{- end -}}
{{- if and .Values.autoUnseal.enabled .Values.sealTransit.enabled -}}
{{- fail "set either autoUnseal.enabled or sealTransit.enabled, not both" -}}
{{- end -}}
{{- if and .Values.autoUnseal.enabled (not .Values.sealTransit.enabled) (not .Values.autoUnseal.existingSecret) (not .Values.autoUnseal.create) -}}
{{- fail "autoUnseal.enabled is true: set autoUnseal.existingSecret, or autoUnseal.create with autoUnseal.key" -}}
{{- end -}}
{{- if not (has .Values.storage.type (list "file" "mysql")) -}}
{{- fail "storage.type must be \"file\" or \"mysql\"" -}}
{{- end -}}
{{- if and (eq .Values.storage.type "mysql") (not .Values.storage.mysql.dsnSecret) -}}
{{- fail "storage.type=mysql requires storage.mysql.dsnSecret (a Secret holding the DSN)" -}}
{{- end -}}
{{- $tlsSecret := "" -}}
{{- if .Values.tls.enabled -}}
{{- $tlsSecret = default .Values.tls.certManager.secretName .Values.tls.existingSecret -}}
{{- if .Values.tls.certManager.enabled -}}{{- $tlsSecret = .Values.tls.certManager.secretName -}}{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ubixvault.fullname" . }}
  labels:
    {{- include "ubixvault.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "ubixvault.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ubixvault.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ubixvault.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ubixvault.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ubixvault
          image: {{ include "ubixvault.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - server
            - -listen
            - {{ printf "0.0.0.0:%d" (int .Values.containerPort) | quote }}
            {{- if eq .Values.storage.type "mysql" }}
            - -storage
            - mysql
            {{- else }}
            - -data
            - {{ .Values.persistence.mountPath | quote }}
            {{- end }}
            {{- if .Values.tls.enabled }}
            - -tls-cert
            - {{ printf "%s/tls.crt" .Values.tls.mountPath | quote }}
            - -tls-key
            - {{ printf "%s/tls.key" .Values.tls.mountPath | quote }}
            {{- else if .Values.devNoTLS }}
            - -dev-no-tls
            {{- end }}
            {{- if .Values.audit.enabled }}
            - -audit-log
            - {{ .Values.audit.path | quote }}
            {{- end }}
            {{- if .Values.rateLimit.enabled }}
            - -rate-limit
            - {{ .Values.rateLimit.perSecond | quote }}
            - -rate-limit-burst
            - {{ .Values.rateLimit.burst | quote }}
            {{- if .Values.rateLimit.trustForwarded }}
            - -rate-limit-trust-forwarded
            {{- end }}
            {{- end }}
            {{- if .Values.sealTransit.enabled }}
            - -seal-transit-address
            - {{ .Values.sealTransit.address | quote }}
            - -seal-transit-key
            - {{ .Values.sealTransit.key | quote }}
            {{- if .Values.sealTransit.tlsSkipVerify }}
            - -seal-transit-tls-skip-verify
            {{- end }}
            {{- end }}
            {{- if .Values.ha.enabled }}
            - -ha
            - -ha-cluster-listen
            - {{ printf "0.0.0.0:%d" (int .Values.ha.clusterPort) | quote }}
            - -ha-lock-ttl
            - {{ .Values.ha.lockTTL | quote }}
            - -ha-retry-interval
            - {{ .Values.ha.retryInterval | quote }}
            - -shutdown-delay
            - {{ .Values.ha.shutdownDelay | quote }}
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- if .Values.ha.enabled }}
            # Replicas advertise their pod IP: other replicas forward to
            # https://$POD_IP:<clusterPort>, and sys/leader reports the API URL.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- end }}
            {{- if .Values.autoUnseal.enabled }}
            - name: UBIXVAULT_AUTO_UNSEAL_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ubixvault.autoUnsealSecretName" . }}
                  key: {{ .Values.autoUnseal.secretKey }}
            {{- end }}
            {{- if .Values.sealTransit.enabled }}
            - name: UBIXVAULT_SEAL_TRANSIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "sealTransit.enabled requires sealTransit.existingSecret" .Values.sealTransit.existingSecret }}
                  key: {{ .Values.sealTransit.secretKey }}
            {{- end }}
            {{- if eq .Values.storage.type "mysql" }}
            - name: UBIXVAULT_STORAGE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.mysql.dsnSecret }}
                  key: {{ .Values.storage.mysql.dsnSecretKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: api
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
            {{- if .Values.ha.enabled }}
            - name: cluster
              containerPort: {{ .Values.ha.clusterPort }}
              protocol: TCP
            {{- end }}
          # Liveness/startup use /v1/sys/livez, which returns 200 whenever the
          # process is serving — regardless of seal state — so a sealed vault is
          # never killed before it can be (auto-)unsealed, and (unlike a bare TCP
          # probe) a hung HTTP server is still detected. Readiness uses
          # /v1/sys/health (503 while sealed) so only an unsealed vault gets
          # traffic. (livez requires uBixVault >= 0.2.0-beta.10.)
          startupProbe:
            httpGet:
              path: /v1/sys/livez
              port: api
              scheme: {{ if .Values.tls.enabled }}HTTPS{{ else }}HTTP{{ end }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /v1/sys/livez
              port: api
              scheme: {{ if .Values.tls.enabled }}HTTPS{{ else }}HTTP{{ end }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          # With HA, an unsealed standby is ready too (it forwards to the active),
          # which is also what lets a rolling update move from pod to pod.
          readinessProbe:
            httpGet:
              path: {{ if .Values.ha.enabled }}/v1/sys/health?standbyok=true{{ else }}/v1/sys/health{{ end }}
              port: api
              scheme: {{ if .Values.tls.enabled }}HTTPS{{ else }}HTTP{{ end }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if eq .Values.storage.type "file" }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: {{ .Values.tls.mountPath }}
              readOnly: true
            {{- end }}
            {{- if and .Values.audit.enabled .Values.audit.persistence.enabled }}
            - name: audit
              mountPath: {{ .Values.audit.persistence.mountPath }}
            {{- end }}
      volumes:
        {{- if eq .Values.storage.type "file" }}
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- else if .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- end }}
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ $tlsSecret }}
        {{- end }}
        {{- if and .Values.audit.enabled (not .Values.audit.persistence.enabled) }}
        - name: audit
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if and .Values.ha.enabled (eq .Values.ha.antiAffinity "soft") }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "ubixvault.selectorLabels" . | nindent 20 }}
      {{- else if and .Values.ha.enabled (eq .Values.ha.antiAffinity "hard") }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "ubixvault.selectorLabels" . | nindent 18 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if or (and (eq .Values.storage.type "file") .Values.persistence.enabled (not .Values.persistence.existingClaim)) (and .Values.audit.enabled .Values.audit.persistence.enabled) }}
  volumeClaimTemplates:
    {{- if and (eq .Values.storage.type "file") .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
    - metadata:
        name: data
        labels:
          {{- include "ubixvault.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
    {{- end }}
    {{- if and .Values.audit.enabled .Values.audit.persistence.enabled }}
    - metadata:
        name: audit
        labels:
          {{- include "ubixvault.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.audit.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.audit.persistence.size }}
        {{- if .Values.audit.persistence.storageClass }}
        storageClassName: {{ .Values.audit.persistence.storageClass | quote }}
        {{- end }}
    {{- end }}
  {{- end }}
