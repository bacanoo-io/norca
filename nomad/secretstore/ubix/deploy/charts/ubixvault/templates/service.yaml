apiVersion: v1
kind: Service
metadata:
  name: {{ include "ubixvault.fullname" . }}
  labels:
    {{- include "ubixvault.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: {{ if .Values.tls.enabled }}https{{ else }}http{{ end }}
      port: {{ .Values.service.port }}
      targetPort: api
      protocol: TCP
  selector:
    {{- include "ubixvault.selectorLabels" . | nindent 4 }}
