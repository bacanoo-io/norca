{{- if and .Values.autoUnseal.enabled .Values.autoUnseal.create -}}
{{- if .Values.autoUnseal.existingSecret -}}
{{- fail "autoUnseal: set either existingSecret OR create, not both" -}}
{{- end -}}
{{- if not .Values.autoUnseal.key -}}
{{- fail "autoUnseal.create is true but autoUnseal.key is empty (need 64 hex chars); pass it via --set-string" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ubixvault.autoUnsealSecretName" . }}
  labels:
    {{- include "ubixvault.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.autoUnseal.secretKey }}: {{ .Values.autoUnseal.key | quote }}
{{- end }}
