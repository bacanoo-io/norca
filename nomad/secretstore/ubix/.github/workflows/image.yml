name: Image

# Build and publish the container image to GitHub Container Registry (ghcr.io).
# - Version tags (vX.Y.Z) publish the released image (e.g. :0.2.0-beta.1).
# - Pushes to main publish a moving :edge tag for testing the latest commit.
# - workflow_dispatch allows a manual build.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write
  id-token: write # keyless cosign signing/attestation via GitHub OIDC

jobs:
  publish:
    name: Build & push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=edge,branch=main
            type=sha
          labels: |
            org.opencontainers.image.title=uBixVault
            org.opencontainers.image.description=Self-hosted secrets manager (HashiCorp Vault-style)
            org.opencontainers.image.licenses=BSD-3-Clause

      - name: Build & push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Supply-chain: keyless-sign the image and attach an SBOM attestation, both
      # bound to the immutable digest and verifiable via the GitHub OIDC identity.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the published image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          # Don't attach to the GitHub Release: it needs contents:write (this
          # workflow is least-privilege contents:read), and the SBOM is already
          # published as a workflow artifact and a cosign attestation below.
          upload-release-assets: false

      - name: Attest the SBOM to the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${IMAGE}@${DIGEST}"
