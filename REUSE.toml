version = 1

# Documentation: MPL 2.0
[[annotations]]
path = ["docs/**", "*.md", "NOTICE", ".github/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Norca contributors"
SPDX-License-Identifier = "MPL-2.0"

# UI mockup: own part MPL 2.0, embedded Tabler CSS and Tabler icons MIT
[[annotations]]
path = "docs/design/mockups/**"
precedence = "override"
SPDX-FileCopyrightText = ["2026 Norca contributors", "codecalm.net Paweł Kuna (Tabler)"]
SPDX-License-Identifier = "MPL-2.0 AND MIT"

# Images in the documentation
[[annotations]]
path = "docs/**/*.png"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Norca contributors"
SPDX-License-Identifier = "MPL-2.0"

# Files of the HashiCorp forks keep their own headers; files without a header
# (generated code, test data) fall under the license of the fork
[[annotations]]
path = ["nomad/**", "nomad-pack/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "HashiCorp, Inc. and Norca contributors"
SPDX-License-Identifier = "MPL-2.0"

# briandowns/spinner (https://github.com/briandowns/spinner, Apache-2.0),
# copied into Nomad Pack and changed there by HashiCorp. The files keep the
# Apache-2.0 notice of the original under an MPL-2.0 header that the
# upstream header tool put in place of the original copyright line
# ("Copyright (c) 2021 Brian J. Downs"); LICENSE in the directory is the
# Apache License 2.0. This annotation overrides the file headers.
[[annotations]]
path = ["nomad-pack/internal/pkg/spinner/**"]
precedence = "override"
SPDX-FileCopyrightText = ["2021-2022 Brian J. Downs", "IBM Corp. 2021, 2025"]
SPDX-License-Identifier = "Apache-2.0 AND MPL-2.0"
