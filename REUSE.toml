version = 1

# Documentation: MPL 2.0
[[annotations]]
path = ["docs/**", "*.md", "NOTICE", ".github/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Norca contributors"
SPDX-License-Identifier = "MPL-2.0"

# UI mockup: own part MPL 2.0, embedded Tabler CSS and Tabler icons MIT
[[annotations]]
path = "docs/design/mockups/**"
precedence = "override"
SPDX-FileCopyrightText = ["2026 Norca contributors", "codecalm.net Paweł Kuna (Tabler)"]
SPDX-License-Identifier = "MPL-2.0 AND MIT"

# Pack registry: own packs, MPL 2.0 (the files also carry SPDX headers)
[[annotations]]
path = ["packs/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Norca contributors"
SPDX-License-Identifier = "MPL-2.0"

# Images in the documentation
[[annotations]]
path = "docs/**/*.png"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Norca contributors"
SPDX-License-Identifier = "MPL-2.0"

# Files of the HashiCorp forks keep their own headers; files without a header
# (generated code, test data) fall under the license of the fork.
# nomad/pack/** originates from HashiCorp Nomad Pack v0.4.2 (MPL 2.0).
[[annotations]]
path = ["nomad/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "HashiCorp, Inc. and Norca contributors"
SPDX-License-Identifier = "MPL-2.0"

# Test fixture copied unmodified from the Nomad Pack Community Registry (MPL 2.0),
# see nomad/pack/fixtures/community/README.md.
[[annotations]]
path = ["nomad/pack/fixtures/community/packs/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "IBM Corp. and the Nomad Pack Community Registry contributors"
SPDX-License-Identifier = "MPL-2.0"

# THIRD_PARTY_NOTICES.md is generated (nomad/tools/thirdparty) and reproduces the
# license texts and notices of the dependencies, some of which contain SPDX tags of
# their own; those describe the dependencies, not this file.
[[annotations]]
path = "THIRD_PARTY_NOTICES.md"
precedence = "override"
SPDX-FileCopyrightText = "2026 Norca contributors"
SPDX-License-Identifier = "MPL-2.0"
