#
# Builds every Go module for Linux and Windows, runs go vet, and runs the unit
# tests that need neither root nor Docker, Consul or Vault. Tests that start
# an agent use a norca binary built in the job and put on the PATH. The
# integration suites (drivers, client, command, nomad, e2e) still run only
# locally; see CONTRIBUTING.md.
#
# Actions are pinned by commit (as in compliance.yml and release.yml):
#   actions/checkout v7.0.1, actions/setup-go v7.0.0.
name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # The norca module and the separate modules inside it.
  MODULES: norca norca/api norca/controller norca/tools

jobs:
  build:
    name: Build ${{ matrix.goos }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: norca/go.mod
          cache-dependency-path: |
            norca/go.sum
            norca/api/go.sum
            norca/controller/go.sum
            norca/tools/go.sum
      - name: go build ./...
        env:
          GOOS: ${{ matrix.goos }}
        run: |
          for m in $MODULES; do
            echo "::group::$m"
            go -C "$m" build ./...
            echo "::endgroup::"
          done

  vet:
    name: go vet
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: norca/go.mod
          cache-dependency-path: |
            norca/go.sum
            norca/api/go.sum
            norca/controller/go.sum
            norca/tools/go.sum
      - name: go vet ./...
        # Every package of every module was vet-clean when this job was added;
        # keep it that way rather than narrowing the package list.
        run: |
          for m in $MODULES; do
            echo "::group::$m"
            go -C "$m" vet ./...
            echo "::endgroup::"
          done

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NORCA_TEST_LOG_LEVEL: "OFF"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: norca/go.mod
          cache-dependency-path: |
            norca/go.sum
            norca/api/go.sum
            norca/controller/go.sum
            norca/tools/go.sum
      - name: Build norca for the tests that start an agent
        # The api and controller tests start a dev agent from the
        # norca binary on the PATH (they skip those tests without one).
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go -C norca build -o "$RUNNER_TEMP/bin/norca" .
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Software TPM
        # The tests of TPM keys (helper/tpmkey, structs/config) run against
        # swtpm; without it they skip.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends swtpm
      - name: norca module
        working-directory: norca
        run: |
          go test -count=1 -p 4 \
            ./acl/... \
            ./client/allocrunner/netpolicy \
            ./client/mtlsproxy \
            ./helper/... \
            ./jobspec/... \
            ./jobspec2/... \
            ./lib/... \
            ./norca/state/... \
            ./norca/structs/... \
            ./scheduler/... \
            ./secretstore/... \
            ./version/...
      - name: uBixVault subtree adapted to the norca module
        # norca/secretstore/ubix must match what norca/tools/ubixsync makes
        # of it (no unused upstream code, rewritten imports, current facades).
        # Its tests, including the fuzz and property tests in their normal,
        # non-fuzzing mode, run with ./secretstore/... above.
        run: go -C norca/tools run ./ubixsync -root "$GITHUB_WORKSPACE" -check
      - name: api, controller and tools modules
        run: |
          for m in norca/api norca/controller norca/tools; do
            echo "::group::$m"
            go -C "$m" test -count=1 -p 4 ./...
            echo "::endgroup::"
          done
