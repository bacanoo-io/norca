#
# Actions are pinned by commit (checkout and setup-go as in release.yml):
#   actions/checkout v7.0.1, actions/setup-go v7.0.0, actions/setup-node v7.1.0,
#   scanoss/gha-code-scan v1.7.0, fsfe/reuse-action v5.0.0.
name: Compliance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reuse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: fsfe/reuse-action@bb774aa972c2a89ff34781233d275075cbddf542 # v5.0.0

  go-licenses:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # Nomad Pack is part of the norca module (norca/pack). The api client
        # is a separate module; the controller SDK depends only on the api
        # module. tools holds the build tools (not shipped).
        module: [norca, norca/api, norca/controller, norca/tools]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Forbidden modules (BSL HashiCorp modules)
        working-directory: ${{ matrix.module }}
        run: |
          # The upstream Nomad main module is forbidden in any version.
          if go list -m all | awk '$1 == "github.com/hashicorp/nomad"' | grep .; then
            echo "Upstream Nomad module among the dependencies" >&2; exit 1
          fi
          # Every github.com/bacanoo-io/norca/norca[/...] module and the upstream
          # github.com/hashicorp/nomad/api (imported by consul-template, replaced
          # by norca/compat/upstreamapi) must be this module or a local replace
          # of this repository, so no upstream version comes from the proxy.
          remote=$(go list -m all | awk '($1 == "github.com/bacanoo-io/norca/norca" || index($1, "github.com/bacanoo-io/norca/norca/") == 1 || index($1, "github.com/hashicorp/nomad/") == 1) && NF > 1 && !($3 == "=>" && $4 ~ /^\.\.?\//)')
          if [ -n "$remote" ]; then
            echo "Nomad modules not replaced by this repository: $remote" >&2; exit 1
          fi
      - name: License check
        working-directory: ${{ matrix.module }}
        run: |
          go install github.com/google/go-licenses@v1.6.0
          # Ignored (their dependencies are still checked):
          # - github.com/bacanoo-io/norca/norca/... and the stand-in
          #   github.com/hashicorp/nomad/api: this repository (MPL 2.0); the
          #   api, controller and tools modules and the stand-in carry no
          #   LICENSE file of their own, and the step above rules out an
          #   upstream version.
          # - packages whose license go-licenses cannot classify; each is a
          #   reviewed decision in norca/tools/thirdparty/overrides.go:
          #   vic/pkg/vsphere/tags (Apache-2.0, the LICENSE file is VMware's
          #   appliance disclosure), go-spin (MIT, stated in its readme only),
          #   libcap/psx (BSD-3-Clause or GPL-2.0, used under BSD-3-Clause).
          go-licenses check ./... \
            --allowed_licenses=MPL-2.0,Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC \
            --ignore github.com/bacanoo-io/norca/norca/ \
            --ignore github.com/hashicorp/nomad/api \
            --ignore github.com/hashicorp/vic/pkg/vsphere/tags \
            --ignore github.com/tj/go-spin \
            --ignore kernel.org/pub/linux/libs/security/libcap/psx

  third-party-notices:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: norca/go.mod
          cache-dependency-path: norca/go.sum
      - name: THIRD_PARTY_NOTICES.md is up to date and every license is allowed
        working-directory: norca
        # Fails if the committed file differs from the generated one ('make
        # notices' regenerates it) or if a dependency's license is not on the
        # allow-list. The UI packages come from the registry tarballs named
        # in norca/ui/yarn.lock; no yarn install is needed.
        run: make check-notices

  ui-licenses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Licenses of the UI dependencies
        working-directory: norca/ui
        env:
          HUSKY_SKIP_INSTALL: "1"
        run: |
          # The UI uses yarn v1 (yarn.lock). Production dependencies only:
          # the optionalDependencies of package.json are Storybook (a
          # development tool), and without --production the tree also holds
          # the devDependencies, which license-checker's --production flag
          # does not filter out reliably in a hoisted yarn tree.
          yarn install --production --ignore-optional --frozen-lockfile --ignore-scripts --ignore-engines
          # --excludePackagesStartingWith: recorded exceptions (norca-doc content/docs/introduction/license.md):
          # caniuse-lite and jsonify are build-time exceptions of the UI.
          # --excludePackages: non-SPDX license fields whose license files are
          # allowed licenses: source-map 0.1.43 "BSD" (BSD-3-Clause text) and
          # sourcemap-validator 1.1.1 (no field, MIT in its readme), build-time
          # packages of ember-source; JSV 4.0.2
          # "FreeBSD" (BSD-2-Clause text in lib/jsv.js), a dependency of the
          # jsonlint command line tool, not bundled.
          npx --yes license-checker-rseidelsohn@4 --production \
            --onlyAllow "MPL-2.0;Apache-2.0;MIT;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;CC0-1.0" \
            --excludePrivatePackages \
            --excludePackagesStartingWith "caniuse-lite@;jsonify@" \
            --excludePackages "source-map@0.1.43;sourcemap-validator@1.1.1;JSV@4.0.2"
          # Check the whole installed tree, transitive dependencies included
          if yarn list --pattern apexcharts 2>/dev/null | grep -q apexcharts@; then
            echo "ApexCharts is forbidden" >&2; exit 1
          fi

  forbidden-packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No ApexCharts in any lock or package file
        run: |
          # ApexCharts is dual-licensed; its community license forbids embedding
          # it in a product used by others (norca-doc content/docs/introduction/license.md)
          files=$(git ls-files '*package.json' '*yarn.lock' '*package-lock.json' '*pnpm-lock.yaml')
          if [ -n "$files" ] && grep -il 'apexcharts' $files; then
            echo "ApexCharts is forbidden (found in the files above)" >&2; exit 1
          fi

  snippet-scan:
    # SCANOSS matches the added, modified and renamed files of the pull
    # request or push (delta mode) against the open source knowledge base
    # (api.osskb.org; only fingerprints are sent) and fails on a file or
    # snippet match with a license of the explicit list below (GPL, AGPL,
    # LGPL, SSPL, EUPL, OSL, CC-BY-SA, and the Business Source License).
    # MPL-2.0 is not in the list: the upstream Nomad code itself is MPL-2.0.
    #
    # The second step reads the result and reports every match in the job
    # summary. A match with a component declared in scanoss.json (the works
    # Norca is built on) is only listed; a match with any other component is
    # a warning on the file, because code taken from an Apache, MIT or BSD
    # project needs its attribution; a match under the Business Source
    # License fails the job. The similarity audit (CLEAN_ROOM.md) remains the
    # thorough comparison with HashiCorp's BSL code; this is the quick one on
    # every change.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      checks: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: scanoss/gha-code-scan@d3c8f659544885761c8e3b96743ea14b830474aa # v1.7.0
        id: scan
        with:
          scanMode: delta
          policies: copyleft
          # Strong and weak copyleft licenses (comma-separated, no spaces).
          licenses.copyleft.explicit: GPL-1.0-only,GPL-1.0-or-later,GPL-2.0-only,GPL-2.0-or-later,GPL-3.0-only,GPL-3.0-or-later,AGPL-1.0-only,AGPL-1.0-or-later,AGPL-3.0-only,AGPL-3.0-or-later,LGPL-2.0-only,LGPL-2.0-or-later,LGPL-2.1-only,LGPL-2.1-or-later,LGPL-3.0-only,LGPL-3.0-or-later,SSPL-1.0,EUPL-1.1,EUPL-1.2,OSL-3.0,CC-BY-SA-4.0,BUSL-1.1
      - name: Report every match
        if: always()
        env:
          RESULT: ${{ steps.scan.outputs.result-filepath }}
        run: python3 .github/scripts/snippet-matches.py "${RESULT:-scanoss-raw.json}" scanoss.json

  dco:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check Signed-off-by
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          # The imported upstream history (Nomad up to 8495495ba, Nomad Pack v0.4.2) has no sign-offs; only Norca
          # commits are checked: those of the pull request, or those a push to main brings. A push that creates
          # the branch, or replaces it (the commit before the push is not in the clone), checks every Norca commit.
          # A git subtree add or pull brings upstream history along: the commits reachable from the upstream
          # commit it names (git-subtree-split) are not Norca's own and are left out.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            range="origin/$BASE_REF..HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range="HEAD ^8495495badaa598c84a82affa7406bc99ef2c370 ^cd4d2a41c22adba1350b8d5da63252f2dde33262"
          fi
          upstream=$(git log --merges --format=%B $range |
            sed -n 's/^git-subtree-split: *\([0-9a-f]\{40\}\)$/^\1/p')
          missing=$(git log --no-merges --format='%H %(trailers:key=Signed-off-by,valueonly,separator=;)' \
            $range $upstream | awk 'NF<2 {print $1}')
          if [ -n "$missing" ]; then echo "Missing DCO sign-off: $missing" >&2; exit 1; fi
          echo "DCO: every Norca commit of $range is signed off"
