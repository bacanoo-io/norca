#
# Actions are pinned by commit (checkout and setup-go as in release.yml):
#   actions/checkout v7.0.1, actions/setup-go v7.0.0, actions/setup-node v7.1.0.
name: Compliance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reuse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: fsfe/reuse-action@v5

  go-licenses:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # Nomad Pack is part of the nomad module (nomad/pack). The api client
        # is a separate module; the controller SDK depends only on the api
        # module; the NATS bridge depends on the api and controller modules
        # and nats.go. tools holds the build tools (not shipped).
        module: [nomad, nomad/api, nomad/controller, nomad/natsbridge, nomad/tools]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Forbidden modules (BSL HashiCorp modules)
        working-directory: ${{ matrix.module }}
        run: |
          # BSL versions of the Nomad main module are forbidden; the fork's own modules and the api module are allowed.
          if go list -m all | grep -E '^github.com/hashicorp/nomad v1\.([7-9]|[1-9][0-9])\.|^github.com/hashicorp/nomad v1\.6\.([6-9]|[1-9][0-9])'; then
            echo "BSL Nomad module among the dependencies" >&2; exit 1
          fi
          # Every github.com/hashicorp/nomad[/...] module must be this module or
          # a local replace of this repository (so no upstream version, BSL
          # pseudo-versions included, comes from the proxy).
          remote=$(go list -m all | awk '($1 == "github.com/hashicorp/nomad" || index($1, "github.com/hashicorp/nomad/") == 1) && NF > 1 && !($3 == "=>" && $4 ~ /^\.\.?\//)')
          if [ -n "$remote" ]; then
            echo "Nomad modules not replaced by this repository: $remote" >&2; exit 1
          fi
      - name: License check
        working-directory: ${{ matrix.module }}
        run: |
          go install github.com/google/go-licenses@v1.6.0
          # Ignored (their dependencies are still checked):
          # - github.com/hashicorp/nomad/...: this repository (MPL 2.0); the
          #   api, controller, natsbridge and tools modules carry no LICENSE
          #   file of their own, and the step above rules out a BSL version.
          # - packages whose license go-licenses cannot classify; each is a
          #   reviewed decision in nomad/tools/thirdparty/overrides.go:
          #   vic/pkg/vsphere/tags (Apache-2.0, the LICENSE file is VMware's
          #   appliance disclosure), go-spin (MIT, stated in its readme only),
          #   libcap/psx (BSD-3-Clause or GPL-2.0, used under BSD-3-Clause).
          go-licenses check ./... \
            --allowed_licenses=MPL-2.0,Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC \
            --ignore github.com/hashicorp/nomad/ \
            --ignore github.com/hashicorp/vic/pkg/vsphere/tags \
            --ignore github.com/tj/go-spin \
            --ignore kernel.org/pub/linux/libs/security/libcap/psx

  third-party-notices:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: nomad/go.mod
          cache-dependency-path: nomad/go.sum
      - name: THIRD_PARTY_NOTICES.md is up to date and every license is allowed
        working-directory: nomad
        # Fails if the committed file differs from the generated one ('make
        # notices' regenerates it) or if a dependency's license is not on the
        # allow-list. The UI packages come from the registry tarballs named
        # in nomad/ui/yarn.lock; no yarn install is needed.
        run: make check-notices

  ui-licenses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Licenses of the UI dependencies
        working-directory: nomad/ui
        env:
          HUSKY_SKIP_INSTALL: "1"
        run: |
          # The UI uses yarn v1 (yarn.lock). Production dependencies only:
          # the optionalDependencies of package.json are Storybook (a
          # development tool), and without --production the tree also holds
          # the devDependencies, which license-checker's --production flag
          # does not filter out reliably in a hoisted yarn tree.
          yarn install --production --ignore-optional --frozen-lockfile --ignore-scripts --ignore-engines
          # --excludePackagesStartingWith: legacy UI exceptions
          # (docs/licensing.md), removed with /ui/legacy.
          # --excludePackages: non-SPDX license fields whose license files are
          # allowed licenses: dialog-polyfill "BSD" (BSD-3-Clause text, see
          # THIRD_PARTY_NOTICES.md), source-map 0.1.43 "BSD" (BSD-3-Clause
          # text), sourcemap-validator 1.1.1 (no field, MIT in its readme);
          # the last two are build-time packages of ember-source; JSV 4.0.2
          # "FreeBSD" (BSD-2-Clause text in lib/jsv.js), a dependency of the
          # jsonlint command line tool, not bundled.
          npx --yes license-checker-rseidelsohn@4 --production \
            --onlyAllow "MPL-2.0;Apache-2.0;MIT;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;CC0-1.0" \
            --excludePrivatePackages \
            --excludePackagesStartingWith "robust-predicates@;caniuse-lite@;jsonify@" \
            --excludePackages "dialog-polyfill@0.5.6;source-map@0.1.43;sourcemap-validator@1.1.1;JSV@4.0.2"
          # Check the whole installed tree, transitive dependencies included
          if yarn list --pattern apexcharts 2>/dev/null | grep -q apexcharts@; then
            echo "ApexCharts is forbidden" >&2; exit 1
          fi

  forbidden-packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No ApexCharts in any lock or package file
        run: |
          # ApexCharts is dual-licensed; its community license forbids embedding
          # it in a product used by others (docs/licensing.md)
          files=$(git ls-files '*package.json' '*yarn.lock' '*package-lock.json' '*pnpm-lock.yaml')
          if [ -n "$files" ] && grep -il 'apexcharts' $files; then
            echo "ApexCharts is forbidden (found in the files above)" >&2; exit 1
          fi

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check Signed-off-by
        run: |
          # The imported upstream history (nomad/, Nomad Pack) has no sign-offs; only commits of the PR are checked.
          # A git subtree add or pull in the PR brings upstream history along: the commits reachable from the
          # upstream commit it names (git-subtree-split) are not the PR's own and are left out.
          upstream=$(git log --merges --format=%B origin/${{ github.base_ref }}..HEAD |
            sed -n 's/^git-subtree-split: *\([0-9a-f]\{40\}\)$/^\1/p')
          missing=$(git log --no-merges --format='%H %(trailers:key=Signed-off-by,valueonly,separator=;)' \
            origin/${{ github.base_ref }}..HEAD $upstream | awk 'NF<2 {print $1}')
          if [ -n "$missing" ]; then echo "Missing DCO sign-off: $missing" >&2; exit 1; fi
