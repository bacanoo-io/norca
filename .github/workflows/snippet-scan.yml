#
# Actions are pinned by commit (as in compliance.yml):
#   actions/checkout v7.0.1, scanoss/gha-code-scan v1.7.0.
name: Snippet scan

# Started by hand only. The free SCANOSS service (api.osskb.org) has a request
# limit; a scan on every pull request and push used it up, and then the
# service refused every scan for days, so nothing was checked at all.
on:
  workflow_dispatch:
    inputs:
      base:
        description: >-
          Commit or ref the scan starts from: the files added, modified or
          renamed between it and the selected branch are scanned. Empty: the
          commit of the last successful run of this workflow.
        required: false
        default: ''

permissions:
  contents: read

jobs:
  snippet-scan:
    # SCANOSS matches the files added, modified and renamed since the base
    # commit against the open source knowledge base (api.osskb.org; only
    # fingerprints are sent) and fails on a file or snippet match with a
    # license of the explicit list below (GPL, AGPL, LGPL, SSPL, EUPL, OSL,
    # CC-BY-SA, and the Business Source License). MPL-2.0 is not in the list:
    # the upstream Nomad code itself is MPL-2.0.
    #
    # The delta mode of the action works only on pull request and push
    # events, so the job collects the changed files itself into a directory
    # and the action scans that directory in full mode. The settings file
    # must be under the scanned path; it is copied there.
    #
    # The last step reads the result and reports every match in the job
    # summary. A match with a component declared in scanoss.json (the works
    # Norca is built on) is only listed; a match with any other component is
    # a warning on the file, because code taken from an Apache, MIT or BSD
    # project needs its attribution; a match under the Business Source
    # License fails the job. The similarity audit (CLEAN_ROOM.md) remains the
    # thorough comparison with HashiCorp's BSL code; this is the quick one.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Collect the files changed since the base
        id: delta
        env:
          BASE_INPUT: ${{ inputs.base }}
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$BASE_INPUT"
          if [ -z "$base" ]; then
            base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow snippet-scan.yml \
              --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          fi
          if [ -z "$base" ]; then
            echo "::error::no successful run of this workflow yet: give the base commit" >&2
            exit 1
          fi
          if ! base_sha=$(git rev-parse --verify --quiet "$base^{commit}"); then
            echo "::error::the base '$base' is not a commit of this repository" >&2
            exit 1
          fi
          mkdir snippet-delta
          count=0
          while IFS= read -r -d '' file; do
            # A file deleted again by a later commit is not in the tree.
            [ -f "$file" ] || continue
            mkdir -p "snippet-delta/$(dirname "$file")"
            cp "$file" "snippet-delta/$file"
            count=$((count + 1))
          done < <(git diff --name-only -z --diff-filter=AMR "$base_sha" HEAD)
          cp scanoss.json snippet-delta/scanoss.json
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Scanning $count files changed between $base_sha and $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: scanoss/gha-code-scan@d3c8f659544885761c8e3b96743ea14b830474aa # v1.7.0
        id: scan
        if: steps.delta.outputs.count != '0'
        with:
          scanMode: full
          scanPath: snippet-delta
          policies: copyleft
          # Strong and weak copyleft licenses (comma-separated, no spaces).
          licenses.copyleft.explicit: GPL-1.0-only,GPL-1.0-or-later,GPL-2.0-only,GPL-2.0-or-later,GPL-3.0-only,GPL-3.0-or-later,AGPL-1.0-only,AGPL-1.0-or-later,AGPL-3.0-only,AGPL-3.0-or-later,LGPL-2.0-only,LGPL-2.0-or-later,LGPL-2.1-only,LGPL-2.1-or-later,LGPL-3.0-only,LGPL-3.0-or-later,SSPL-1.0,EUPL-1.1,EUPL-1.2,OSL-3.0,CC-BY-SA-4.0,BUSL-1.1
      - name: Report every match
        if: always() && steps.delta.outputs.count != '0'
        env:
          RESULT: ${{ steps.scan.outputs.result-filepath }}
        run: python3 .github/scripts/snippet-matches.py "${RESULT:-scanoss-raw.json}" scanoss.json
